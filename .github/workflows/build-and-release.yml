name: Build and Release Package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    name: Build Extension Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate manifest.json syntax
        run: |
          python3 -c "import json; json.load(open('manifest.json'))"
          echo "manifest.json is valid JSON."

      - name: Create ZIP package (with manifest.json at root)
        run: |
          zip -r coursepower-extensions.zip manifest.json src README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coursepower-extensions-package
          path: coursepower-extensions.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: coursepower-extensions.zip
          generate_release_notes: true

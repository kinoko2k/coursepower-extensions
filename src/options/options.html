<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoursePower 拡張設定</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #ffffff;
      }

      main {
        max-width: 520px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 20px;
      }

      .field {
        margin-bottom: 14px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        box-sizing: border-box;
      }

      .checkbox {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .checkbox label {
        margin: 0;
      }

      button {
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        padding: 8px 12px;
        background: #f7f7f7;
        cursor: pointer;
      }

      #status {
        margin-top: 12px;
        color: #0d6f37;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CoursePower 自動ログイン設定</h1>
      <form id="settingsForm">
        <div class="field">
          <label for="loginPageUrl">ログインページURL</label>
          <input
            id="loginPageUrl"
            name="loginPageUrl"
            type="text"
            placeholder="例: https://example.com/lms/lginLgir/"
            autocomplete="url"
          />
        </div>
        <div class="field">
          <label for="userId">ユーザーID</label>
          <input id="userId" name="userId" type="text" autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">パスワード</label>
          <input id="password" name="password" type="password" autocomplete="current-password" />
        </div>
        <div class="field checkbox">
          <input id="autoLoginEnabled" name="autoLoginEnabled" type="checkbox" />
          <label for="autoLoginEnabled">自動ログインを有効にする</label>
        </div>

        <h2 style="font-size: 16px; margin-top: 24px; border-top: 1px solid #eee; padding-top: 16px;">セッションタイムアウト警告</h2>
        <div class="field checkbox">
          <input id="sessionTimerEnabled" name="sessionTimerEnabled" type="checkbox" />
          <label for="sessionTimerEnabled">タイムアウト警告を有効にする</label>
        </div>
        <div class="field">
          <label for="sessionTimeout">タイムアウト時間 (分)</label>
          <input id="sessionTimeout" name="sessionTimeout" type="number" min="1" value="30" style="width: 100%; padding: 8px 10px; border: 1px solid #d0d0d0; border-radius: 6px; box-sizing: border-box;" />
        </div>

        <button type="submit" style="margin-top: 12px;">保存</button>
      </form>
      <p id="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
